name: Coverage

on:
  pull_request:
    branches:
      - "*"
    paths:
      - "src/**"
      - "__tests__/**"
      - "__stubs__/**"
      - "lib/bclibc"
      - "package.json"
      - "yarn.lock"
      - "tsconfig*.json"
      - "jest.config.*"
      - "Makefile"
      - ".github/workflows/coverage.yml"
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Init bclibc submodule
        run: git submodule update --init lib/bclibc

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - name: Build WASM
        run: uv run --no-project --with ziglang make build-wasm

      - name: Run tests with coverage
        run: NODE_OPTIONS='--experimental-vm-modules' npx jest --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
