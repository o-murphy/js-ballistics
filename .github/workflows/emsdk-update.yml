name: Emscripten SDK Update
run-name: "Emscripten SDK Update — ${{ inputs.version || 'auto' }}"

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Emscripten version to pin (e.g. 6.0.8). Leave empty to auto-detect latest."
        required: false
        default: ""
      force:
        description: "Force PR update even if the pinned version is unchanged."
        type: boolean
        required: false
        default: false

concurrency:
  group: emsdk-update
  cancel-in-progress: true

jobs:
  update:
    name: Check & bump Emscripten version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── Resolve target Emscripten version ────────────────────────────────────
      - name: Resolve latest Emscripten version
        id: emsdk
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "source=manual" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(curl -fsSL \
              "https://raw.githubusercontent.com/emscripten-core/emsdk/main/emscripten-releases-tags.json" \
              | jq -r '.aliases.latest')
            echo "source=auto" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Emscripten version: $VERSION"

      # ── Check whether it's already pinned or a PR is already open ───────────
      - name: Check current pin and existing PR
        id: check
        env:
          VERSION: ${{ steps.emsdk.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(cat .emsdk-version)
          BRANCH="emsdk-update/${VERSION}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" != "true" ] && [ "$CURRENT" = "$VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already pinned to $VERSION — nothing to do."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)
          echo "open_pr=${OPEN_PR}" >> "$GITHUB_OUTPUT"
          if [ -n "$OPEN_PR" ]; then
            echo "PR #${OPEN_PR} already open — will update it."
          else
            echo "No open PR — will create one."
          fi

      # ── Bump .emsdk-version, commit and open/update the PR ──────────────────
      - name: Commit and update/open PR
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION:  ${{ steps.emsdk.outputs.version }}
          SOURCE:   ${{ steps.emsdk.outputs.source }}
          BRANCH:   ${{ steps.check.outputs.branch }}
          OPEN_PR:  ${{ steps.check.outputs.open_pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          echo "$VERSION" > .emsdk-version
          git add .emsdk-version
          git commit -m "chore: bump Emscripten to ${VERSION}"
          FORCE_FLAG=""
          [ "${{ inputs.force }}" = "true" ] || [ -n "$OPEN_PR" ] && FORCE_FLAG="--force"
          git push $FORCE_FLAG origin "$BRANCH"

          gh label create "automated" --color "#0075ca" --force || true
          gh label create "emsdk"     --color "#f9d0c4" --force || true

          BODY_FILE=$(mktemp)
          printf 'Automated update: bumps the pinned Emscripten SDK version to `%s` in `.emsdk-version`.\n\nGenerated by the *Emscripten SDK Update* workflow (trigger: `%s`).\n\nCI on this PR builds the WASM module and runs the test suite against the new version (see `test.yml` / `coverage.yml`) — make sure both stay green before merging.\n' \
            "$VERSION" "$SOURCE" > "$BODY_FILE"

          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" \
              --title "chore: bump Emscripten to ${VERSION}" \
              --body-file "$BODY_FILE"
            echo "Updated existing PR #${OPEN_PR}"
          else
            gh pr create \
              --title "chore: bump Emscripten to ${VERSION}" \
              --body-file "$BODY_FILE" \
              --label "automated" \
              --label "emsdk" \
              --base master \
              --head "$BRANCH"
          fi
